<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>漢字の山 — Kanji Mountain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 0;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 40px;
      color: #7fd1ff;
      line-height: 1.4;
    }

    .play-btn {
      padding: 16px 32px;
      background: #4ea3ff;
      color: #fff;
      border-radius: 8px;
      border: none;
      font-size: 22px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .play-btn:hover {
      background: #7fd1ff;
    }
  </style>
</head>

<body>

  <h1>
    漢字の山<br>
    Kanji Mountain
  </h1>

  <!-- ⭐ PLAY BUTTON — Random Kanji Start -->
  <a class="play-btn" href="#" onclick="startRandomKanji()">
    ▶ Play
  </a>

  <script>
    // ⭐ List of all kanji lesson pages
    const kanjiPages = [
      "miru.html",
      "aruku.html",
      "aru.html",
      "asobu.html",
      "ateru.html",
      "au.html",
      "awateru.html",
      "ayamaru.html",
      "chigiru.html",
      "chiru"
      
      // Add more as you create them
    ];

    function startRandomKanji() {
      const page = kanjiPages[Math.floor(Math.random() * kanjiPages.length)];
      window.location.href = page;
    }
  </script>

</body>
</html>
