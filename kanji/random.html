<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Kanji Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
















  <style>
body {
  margin: 0;
  background: #0d0d0d;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 40px;
}

.kanji-screen {
  display: none;
}
.active {
  display: block;
}

button {
  padding: 14px 28px;
  font-size: 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  margin-top: 20px;
}

#kanjiReplayBtn {
  background: #4ea3ff;
  color: #fff;
}
#kanjiNextBtn {
  background: #7fd1ff;
  color: #000;
}

/* ==========================================================
   BASE MCQ BLOCK — unified for nouns + verbs
   ========================================================== */
.mcq-option {
  background: #1a1a1a;        /* identical base color */
  padding: 14px;              /* identical padding */
  margin: 10px auto;
  width: 80%;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s ease;

  display: flex;              /* unified layout */
  justify-content: center;
  align-items: center;
  gap: 12px;                  /* okurigana spacing */
}

.mcq-option:hover {
  background: #333;
}

/* ==========================================================
   NOUNS — only difference is font size
   ========================================================== */
.mcq-noun {
  font-size: 32px;
}

/* ==========================================================
   VERBS — same block, okurigana included
   ========================================================== */
.mcq-verb {
  font-size: 32px;            /* SAME as nouns */
}

/* Okurigana stays smaller */
.okurigana {
  font-size: 22px;
  color: #ffffff;
}

/* ==========================================================
   CORRECT / WRONG COLORS — unified
   ========================================================== */
.mcq-option.correct {
  background: #1e5128 !important;   /* unified green */
}

.mcq-option.wrong {
  background: #512828 !important;   /* unified red */
}
</style>




















</head>

<body>

  <!-- Screen 1: Audio -->
  <div id="kanjiScreen1" class="kanji-screen active">
    <p>Listen to the pronunciation</p>
    <button id="kanjiReplayBtn">▶ Replay Audio</button>
    <button id="kanjiNextBtn">Next</button>
  </div>

  <!-- Screen 2: MCQ -->
  <div id="kanjiScreen2" class="kanji-screen">
    <h2>Select the correct kanji</h2>
    <div id="kanjiMcqContainer"></div>
  </div>

  <!-- Screen 3: Summary -->
  <div id="kanjiScreen3" class="kanji-screen">
    <h2>Summary</h2>
    <p id="kanjiSummaryKanji"></p>
    <p id="kanjiSummaryFurigana"></p>
    <p id="kanjiSummaryRomaji"></p>
    <p id="kanjiSummaryKun"></p>
    <p id="kanjiSummaryOn"></p>
    <p id="kanjiSummaryMeaning"></p>
  </div>

  <!-- Engine -->
 
<script src="kanji.js"></script>


  <!-- Start mode based on URL parameter -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") || "verbs";   // default to verbs

    KANJI.start(mode);
  </script>

</body>
</html>
