<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Random Kanji Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 40px;
    }

    .kanji-screen {
      display: none;
    }
    .active {
      display: block;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    #kanjiReplayBtn {
      background: #4ea3ff;
      color: #fff;
    }
    #kanjiNextBtn {
      background: #7fd1ff;
      color: #000;
    }

    .mcq-option {
      background: #1a1a1a;
      padding: 12px;
      margin: 10px auto;
      width: 80%;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }
    .mcq-option:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <!-- Screen 1: Audio -->
  <div id="kanjiScreen1" class="kanji-screen active">
    <p>Listen to the pronunciation</p>
    <button id="kanjiReplayBtn">▶ Replay Audio</button>
    <button id="kanjiNextBtn">Next</button>
  </div>

  <!-- Screen 2: MCQ -->
  <div id="kanjiScreen2" class="kanji-screen">
    <h2>Select the correct kanji</h2>
    <div id="kanjiMcqContainer"></div>
  </div>

  <!-- Screen 3: Summary -->
  <div id="kanjiScreen3" class="kanji-screen">
    <h2>Summary</h2>
    <p id="kanjiSummaryKanji"></p>
    <p id="kanjiSummaryFurigana"></p>
    <p id="kanjiSummaryRomaji"></p>
    <p id="kanjiSummaryKun"></p>
    <p id="kanjiSummaryOn"></p>
    <p id="kanjiSummaryMeaning"></p>
  </div>

  <!-- Engine -->
  <script src="kanji.js"></script>

  <!-- Start randomized mode -->
  <script>
    KANJI.start("random");
  </script>

</body>
</html>
