<html>

<head>

<title>Honyaku</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.screen{
    width:100%;
}

.hidden{
    display:none;
}

#honyakuScreen{
    width:100%;
}

.honyakuTop{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
}

#honyakuTimer{
    font-size:48px;
    font-weight:bold;
    color:#ff4444;
}

#honyakuReplayBtn{
    margin-top:10px;
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#honyakuInstruction{
    text-align:center;
    font-size:20px;
    margin-bottom:20px;
    color:#dddddd;
}

.honyakuSplit{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.honyakuPlayer{
    background:#1e1e1e;
    border:2px solid #444;
    border-radius:12px;
    padding:15px;
}

.honyakuPlayerTitle{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.honyakuScore{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

/* ==========================================
   PROGRESS
========================================== */

.honyaku-progress-wrapper{
    margin-bottom:20px;
}

.honyaku-progress-label{
    text-align:center;
    margin-bottom:6px;
}

.honyaku-progress-outer{
    width:100%;
    height:10px;
    background:#333;
    border-radius:6px;
    overflow:hidden;
}

.honyaku-progress-bar{
    width:0%;
    height:100%;
    background:#4caf50;
}

.honyakuSectionTitle{
    text-align:center;
    margin-bottom:8px;
    margin-top:12px;
    font-weight:bold;
}

.translationContainer{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:15px;
}

.translationBtn{
    width:100%;
    padding:16px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    color:black;
    text-align:left;
}

.translationBtn:hover{
    background:#eeeeee;
}

.translationBtn.correct{
    background:#4caf50;
    color:white;
}

.translationBtn.wrong{
    background:#f44336;
    color:white;
}

.honyakuReveal{
    display:none;
    margin-bottom:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#4caf50;
}

</style>

</head>

<body>

<div id="honyakuScreen" class="screen">

    <div class="honyakuTop">

        <div id="honyakuTimer">
            30
        </div>

        <button id="honyakuReplayBtn">
            🔁 Replay
        </button>

    </div>

    <div id="honyakuInstruction">
        Listen to the sentence and choose the correct translation.
    </div>

    <div id="honyakuReveal"
         class="honyakuReveal">
    </div>

    <div class="honyakuSplit">

        <!-- PLAYER 1 -->

        <div class="honyakuPlayer">

            <div class="honyakuPlayerTitle">
                👧 Player 1
            </div>

            <div id="honyakuScore1"
                 class="honyakuScore">
                0
            </div>

            <div id="honyakuProgress1">

                <div class="honyaku-progress-wrapper">

                    <div class="honyaku-progress-label">
                        Progress: 0 / 0
                    </div>

                    <div class="honyaku-progress-outer">

                        <div class="honyaku-progress-bar">
                        </div>

                    </div>

                </div>

            </div>

            <div class="honyakuSectionTitle">
                Choose Translation
            </div>

            <div id="translationContainer1"
                 class="translationContainer">

            </div>

        </div>

        <!-- PLAYER 2 -->

        <div class="honyakuPlayer">

            <div class="honyakuPlayerTitle">
                👨 Player 2
            </div>

            <div id="honyakuScore2"
                 class="honyakuScore">
                0
            </div>

            <div id="honyakuProgress2">

                <div class="honyaku-progress-wrapper">

                    <div class="honyaku-progress-label">
                        Progress: 0 / 0
                    </div>

                    <div class="honyaku-progress-outer">

                        <div class="honyaku-progress-bar">
                        </div>

                    </div>

                </div>

            </div>

            <div class="honyakuSectionTitle">
                Choose Translation
            </div>

            <div id="translationContainer2"
                 class="translationContainer">

            </div>

        </div>

    </div>

</div>

<script src="HonyakuProgress.js"></script>
<script src="honyaku.js"></script>

</body>

</html>
