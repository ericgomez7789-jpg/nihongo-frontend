<html>

<head>

<title>Seiku Idiom Engine</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.screen{
    width:100%;
}

.hidden{
    display:none;
}

#seikuScreen{
    width:100%;
}

.seikuTop{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
}

#seikuTimer{
    font-size:48px;
    font-weight:bold;
    color:#ff4444;
}

#seikuReplayBtn{
    margin-top:10px;
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#seikuInstruction{
    text-align:center;
    font-size:20px;
    margin-bottom:20px;
    color:#dddddd;
}

#seikuIdiomBox{
    background:#1f1f1f;
    border:2px solid #555;
    border-radius:12px;
    padding:20px;
    margin:0 auto 20px auto;
    width:70%;
    max-width:700px;
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#81d4fa;
}

#seikuReveal{
    display:none;

    background:#1f1f1f;
    border:1px solid #555;
    border-radius:10px;

    padding:8px;

    margin:0 auto 10px auto;

    width:60%;
    max-width:600px;

    text-align:left;

    font-size:14px;

    line-height:1.3;

    color:white;

    white-space:normal;
}

.seikuSplit{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.seikuPlayer{
    background:#1e1e1e;
    border:2px solid #444;
    border-radius:12px;
    padding:15px;
}

.seikuPlayerTitle{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.seikuScore{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

/* ==========================================
   PROGRESS
========================================== */

.seiku-progress-wrapper{
    margin-bottom:20px;
}

.seiku-progress-label{
    text-align:center;
    margin-bottom:6px;
}

.seiku-progress-outer{
    width:100%;
    height:10px;
    background:#333;
    border-radius:6px;
    overflow:hidden;
}

.seiku-progress-bar{
    width:0%;
    height:100%;
    background:#4caf50;
}

.seikuSectionTitle{
    text-align:center;
    margin-bottom:8px;
    margin-top:12px;
    font-weight:bold;
}

.seikuContainer{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:15px;
}

.seikuBtn{

    width:100%;
    padding:16px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    color:black;
    text-align:left;

    white-space:pre-line;
    line-height:1.5;
}

.seikuBtn:hover{
    background:#eeeeee;
}

.seikuBtn.correct{
    background:#4caf50;
    color:white;
}

.seikuBtn.wrong{
    background:#f44336;
    color:white;
}

</style>

</head>

<body>

<div id="seikuScreen" class="screen">

    <div class="seikuTop">

        <div id="seikuTimer">
            30
        </div>

        <button id="seikuReplayBtn">
            🔁 Replay
        </button>

    </div>

    <div id="seikuInstruction">
        Read the idiom and choose the correct meaning.
    </div>

    <div id="seikuIdiomBox">

    </div>

    <div id="seikuReveal">

    </div>

    <div class="seikuSplit">

        <!-- PLAYER 1 -->

        <div class="seikuPlayer">

            <div class="seikuPlayerTitle">
                👧 Player 1
            </div>

            <div id="seikuScore1"
                 class="seikuScore">
                0
            </div>

            <div id="seikuProgress1">

                <div class="seiku-progress-wrapper">

                    <div class="seiku-progress-label">
                        Progress: 0 / 0
                    </div>

                    <div class="seiku-progress-outer">

                        <div class="seiku-progress-bar">
                        </div>

                    </div>

                </div>

            </div>

            <div class="seikuSectionTitle">
                Choose Meaning
            </div>

            <div id="seikuContainer1"
                 class="seikuContainer">
            </div>

        </div>

        <!-- PLAYER 2 -->

        <div class="seikuPlayer">

            <div class="seikuPlayerTitle">
                👨 Player 2
            </div>

            <div id="seikuScore2"
                 class="seikuScore">
                0
            </div>

            <div id="seikuProgress2">

                <div class="seiku-progress-wrapper">

                    <div class="seiku-progress-label">
                        Progress: 0 / 0
                    </div>

                    <div class="seiku-progress-outer">

                        <div class="seiku-progress-bar">
                        </div>

                    </div>

                </div>

            </div>

            <div class="seikuSectionTitle">
                Choose Meaning
            </div>

            <div id="seikuContainer2"
                 class="seikuContainer">
            </div>

        </div>

    </div>

</div>

<script src="SeikuProgress.js"></script>
<script src="seiku.js"></script>

</body>

</html>
