<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>School Manga — Vol.2 Page 7</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #e6e6e6;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .panel {
      max-width: 900px;
      margin: 0 auto;
    }

    .bubble-text {
      background-color: #1a1a1a;
      padding: 16px;
      border-radius: 10px;
      margin-top: 20px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .jp, .romaji, .en, .es {
      display: block;
      margin-bottom: 8px;
    }

    .jp { color: #ffffff; }
    .romaji { color: #b3b3b3; }
    .en { color: #7fd1ff; }
    .es { color: #4ea3ff; }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    .button-row {
      text-align: center;
      margin: 40px 0;
    }

    .button-row a,
    #repeatBtn {
      padding: 10px 20px;
      background: #444;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      margin: 0 10px;
      display: inline-block;
      cursor: pointer;
    }

    .button-row a:hover,
    #repeatBtn:hover {
      background: #666;
    }
  </style>
</head>

<body>

  <!-- Audio -->
  <div class="panel">
    <audio id="audioPlayer" controls>
      <source src="../vol.2/audio/page7.wav" type="audio/wav">
      Your browser does not support audio playback.
    </audio>
  </div>

  <!-- 4-Layer Text -->
  <div class="bubble-text">

    <!-- Japanese -->
    <span class="jp">
      もう一度質問を言ってくれますか。
    </span>

    <!-- Romaji -->
    <span class="romaji">
      Mou ichido shitsumon wo itte kuremasu ka.
    </span>

    <!-- English -->
    <span class="en">
      Could you repeat the question?
    </span>

    <!-- Spanish -->
    <span class="es">
      ¿Puedes repetir la pregunta?
    </span>

  </div>

  <!-- Next Button -->
  <div class="button-row">
    <a href="volume2-page8.html">Next ▶</a>
  </div>

</body>
</html>
