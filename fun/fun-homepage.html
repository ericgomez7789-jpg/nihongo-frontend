<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FUN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  background:#0d0d0d;
  color:#ffffff;
  font-family:Arial,sans-serif;
}

/* ==========================================================
   SCREENS
   ========================================================== */

.fun-screen{
  display:none;
  padding:40px 0;
  text-align:center;
}

.fun-screen.show{
  display:block;
}

/* ==========================================================
   BUTTONS
   ========================================================== */

.next-btn,
.mcqBtn,
#funReplayBtn,
#funNextBtn{
  padding:12px 24px;
  background:#4ea3ff;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:18px;
  cursor:pointer;
  margin-top:20px;
}

.mcqBtn.correct{
  background:#4caf50 !important;
}

.mcqBtn.wrong{
  background:#b71c1c !important;
}

/* ==========================================================
   MCQ
   ========================================================== */

#funMcqContainer{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:90%;
  max-width:500px;
  margin:40px auto;
}

/* ==========================================================
   PUZZLE REVEAL
   ========================================================== */

#funContainer{
  width:90%;
  max-width:850px;
  margin:0 auto;
}

.puzzle-title{
  font-size:30px;
  margin-bottom:24px;
  color:#7fd1ff;
}

.puzzle-card{
  background:#1a1a1a;
  border-radius:12px;
  padding:32px 24px;
}

.puzzle-japanese{
  font-size:34px;
  font-weight:bold;
  line-height:1.8;
  margin-bottom:16px;
}

.puzzle-romaji{
  font-size:20px;
  color:#aaaaaa;
  line-height:1.8;
  margin-bottom:24px;
}

.puzzle-divider{
  height:1px;
  background:#444;
  margin:24px 0;
}

.puzzle-english{
  font-size:24px;
  line-height:1.8;
}

@media (max-width: 600px){

  .puzzle-japanese{
    font-size:26px;
  }

  .puzzle-romaji{
    font-size:18px;
  }

  .puzzle-english{
    font-size:20px;
  }

}

</style>






</head>

<body>

<!-- ==========================================================
     SCREEN 1
     ========================================================== -->

<div class="fun-screen show" id="funScreen1">

  <p style="font-size:22px;">
    まずは、きくだけ。
  </p>

  <button class="next-btn">
    Next ▶
  </button>

</div>

<!-- ==========================================================
     SCREEN 2
     ========================================================== -->

<div class="fun-screen" id="funScreen2">

  <button id="funReplayBtn">
    ▶ Replay Audio
  </button>

  <div id="funMcqContainer"></div>

</div>

<!-- ==========================================================
     SCREEN 3
     ========================================================== -->

<div class="fun-screen" id="funScreen3">

  <div id="funContainer"></div>

  <button id="funNextBtn">
    Next ▶
  </button>

</div>

<script src="fun.js"></script>

</body>
</html>
