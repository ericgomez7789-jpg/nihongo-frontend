<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>手話の山 — ランダム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .shuwa-screen {
      display: none;
      padding: 40px 0;
      text-align: center;
    }

    .shuwa-screen.show {
      display: block !important;
    }

    .next-btn, .mcqBtn, #shuwaReplayBtn, #shuwaNextBtn {
      padding: 12px 24px;
      background: #4ea3ff;
      color: #fff;
      border-radius: 6px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }

    .mcqBtn.correct {
      background-color: #4caf50 !important;
      color: #fff !important;
    }

    .mcqBtn.wrong {
      background-color: #b71c1c !important;
      color: #fff !important;
    }

    .mcqBtn.correct:hover {
      background-color: #4caf50 !important;
    }

    .mcqBtn.wrong:hover {
      background-color: #b71c1c !important;
    }

    #shuwaMcqContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
    }

    #shuwaCorrectAnswer {
      width: 90%;
      max-width: 600px;
      background: #333;
      padding: 16px;
      border-radius: 10px;
      font-size: 22px;
      margin: 0 auto 20px auto;
      text-align: center;
      font-weight: bold;
    }

    #shuwaSummaryTextHiragana,
    #shuwaSummaryTextEnglish {
      width: 90%;
      max-width: 600px;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 18px;
      margin: 0 auto 20px auto;
    }
  </style>
</head>

<body>

  <!-- ⭐ SCREEN 1 -->
  <div class="shuwa-screen" id="shuwaScreen1">
    <p style="margin-top: 20px; font-size: 20px; opacity: 0.8;">
      まずは、きくだけ。
    </p>
    <button class="next-btn">Next ▶</button>
  </div>

  <!-- ⭐ SCREEN 2 -->
  <div class="shuwa-screen" id="shuwaScreen2">
    <button id="shuwaReplayBtn">▶ Replay Audio</button>
    <div id="shuwaMcqContainer"></div>
  </div>

  <!-- ⭐ SCREEN 3 -->
  <div class="shuwa-screen" id="shuwaScreen3">
    <div id="shuwaCorrectAnswer"></div>
    <div id="shuwaSummaryTextHiragana"></div>
    <div id="shuwaSummaryTextEnglish"></div>
    <button id="shuwaNextBtn">Next ▶</button>
  </div>

  <!-- ⭐ SHUWA ENGINE + DATASETS -->
  <script src="shuwa.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const category = params.get("category");

    if (category === "aisatsu") {
      SHUWA.dataset = shuwaAisatsu;
    } else if (category === "nichijou") {
      SHUWA.dataset = shuwaWeekdaysMonths;
    } else {
      alert("カテゴリーが選ばれていません。ホームにもどってください。");
      return;
    }

    SHUWA.start();
  });
</script>


</body>
</html>
